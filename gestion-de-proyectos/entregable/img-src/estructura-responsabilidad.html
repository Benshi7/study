<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- size: 760x400 -->
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="figure.css">
<style>
.fig { padding: 14px 16px; }
.col { display: flex; flex-direction: column; align-items: center; }
.box { border: 1.5px solid var(--c-accent); border-radius: 10px; padding: 8px 20px; font-size: 17px; font-weight: 700; text-align: center; color: var(--c-heading); background: var(--c-card); }
.box.top { background: var(--c-accent); color: var(--c-bg); min-width: 300px; }
.box small { display: block; font-size: 14.5px; font-weight: 400; }
.box.top small { color: var(--c-bg); }
.arrow { position: relative; width: 2px; height: 18px; background: var(--c-ink); margin: 0 auto; }
.arrow::after { content: ""; position: absolute; left: -5px; bottom: -1px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--c-ink); }
.group { border: 1.5px dashed var(--c-rule); border-radius: 12px; padding: 6px 12px 12px; width: 100%; background: var(--c-bg); }
.group .lbl { text-align: center; font-size: 14.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c-accent); margin: 0 0 6px; }
.teams { display: flex; gap: 12px; }
.teams .box { flex: 1; font-size: 16px; background: var(--c-accent-soft); display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
.box.wide { min-width: 400px; }
</style></head><body><div class="fig"><div class="col">
<div class="box top">Sponsor</div>
<div class="arrow"></div>
<div class="box top">Responsable del proyecto<small>(Director)</small></div>
<div class="arrow"></div>
<div class="group"><p class="lbl">Equipos especializados</p>
<div class="teams"><div class="box">Tecnología y desarrollo</div><div class="box">Datos y gobernanza</div><div class="box">Diseño y experiencia de usuario</div></div></div>
<div class="arrow"></div>
<div class="box wide">Áreas responsables y canales digitales</div>
<div class="arrow"></div>
<div class="box wide">Usuarios y comunidad</div>
</div></div></body></html>
