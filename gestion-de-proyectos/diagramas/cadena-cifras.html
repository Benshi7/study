<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La cadena de cifras</title>
<script src="../assets/theme.js"></script>
<script src="../assets/suite-nav.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Diagram skin for diagram-design SVGs (profile "unicaba-cursada").
   Shared by clases/*.html, slides/* and diagramas/*.html. Self-contained: it does not need course.css.
   Light values = assets/course.css tokens; dark follows data-theme (theme.js) or the system. */
:root {
  --d-paper: #ffffff;
  --d-paper-2: #f8f1f5;
  --d-box: #ffffff;
  --d-ink: #24171f;
  --d-muted: #6a5764;
  --d-soft: #8d7a87;
  --d-rule: #e6d3df;
  --d-accent: #b83a95;
  --d-accent-ink: #9c2a7b;
  --d-accent-tint: rgba(184, 58, 149, .08);
  --d-link: #6b2fae;
  --d-link-tint: rgba(107, 47, 174, .08);
}
:root[data-theme="dark"] {
  --d-paper: #1a1218;
  --d-paper-2: #241a22;
  --d-box: #241a22;
  --d-ink: #f2e9ef;
  --d-muted: #b3a3ae;
  --d-soft: #8f7d89;
  --d-rule: #43303e;
  --d-accent: #f08fcf;
  --d-accent-ink: #f08fcf;
  --d-accent-tint: rgba(240, 143, 207, .10);
  --d-link: #b99af0;
  --d-link-tint: rgba(185, 154, 240, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --d-paper: #1a1218;
    --d-paper-2: #241a22;
    --d-box: #241a22;
    --d-ink: #f2e9ef;
    --d-muted: #b3a3ae;
    --d-soft: #8f7d89;
    --d-rule: #43303e;
    --d-accent: #f08fcf;
    --d-accent-ink: #f08fcf;
    --d-accent-tint: rgba(240, 143, 207, .10);
    --d-link: #b99af0;
    --d-link-tint: rgba(185, 154, 240, .10);
  }
}

/* Figure wrapper used by lessons */
figure.diagram { margin: 1.6rem 0; }
figure.diagram svg { display: block; width: 100%; height: auto; }
figure.diagram figcaption { font-family: "Montserrat", system-ui, sans-serif; font-size: .75rem; color: var(--muted, var(--d-muted)); margin-top: .5rem; }

/* SVG classes (all prefixed dg-) */
.dg-bg { fill: var(--d-paper); }
.dg-mask { fill: var(--d-paper); }
.dg-zone { fill: var(--d-paper-2); stroke: var(--d-rule); stroke-width: 1; }
.dg-rule { stroke: var(--d-rule); stroke-width: .8; fill: none; }

.dg-box { fill: var(--d-box); stroke: var(--d-ink); stroke-width: 1; }
.dg-store { fill: var(--d-paper-2); stroke: var(--d-muted); stroke-width: 1; }
.dg-focal { fill: var(--d-accent-tint); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-viol { fill: var(--d-link-tint); stroke: var(--d-link); stroke-width: 1; }
.dg-ghost { fill: none; stroke: var(--d-muted); stroke-width: 1; stroke-dasharray: 4 3; }
.dg-dot { fill: var(--d-paper-2); stroke: var(--d-muted); stroke-width: 1; }
.dg-dot-focal { fill: var(--d-accent); stroke: var(--d-accent); stroke-width: 1; }

.dg-line { stroke: var(--d-muted); stroke-width: 1.2; fill: none; }
.dg-line-accent { stroke: var(--d-accent); stroke-width: 1.2; fill: none; }
.dg-line-link { stroke: var(--d-link); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.dg-ah { fill: var(--d-muted); }
.dg-ah-accent { fill: var(--d-accent); }
.dg-ah-link { fill: var(--d-link); }

.dg-name { font: 600 16px "Montserrat", system-ui, sans-serif; fill: var(--d-ink); }
.dg-sub { font: 500 12px "Montserrat", system-ui, sans-serif; fill: var(--d-muted); }
.dg-row { font: 600 16px "Montserrat", system-ui, sans-serif; fill: var(--d-ink); }
.dg-tag { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-soft); letter-spacing: .08em; }
.dg-lbl { font: 400 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-muted); letter-spacing: .04em; }
.dg-lbl-accent { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-accent-ink); letter-spacing: .04em; }
.dg-lbl-link { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-link); letter-spacing: .04em; }
.dg-note { font: 500 12px "Montserrat", system-ui, sans-serif; fill: var(--d-muted); }
.dg-note-accent { font: 600 12px "Montserrat", system-ui, sans-serif; fill: var(--d-accent-ink); }

/* Catedra slide screenshots (clases/img/*.jpg) shown next to the own diagrams. */
figure.slide { margin: 1.4rem 0; }
figure.slide img { display: block; width: 100%; max-width: 720px; height: auto; border: 1px solid var(--rule, #e6d3df); border-radius: 6px; }
figure.slide figcaption { font-family: "Montserrat", system-ui, sans-serif; font-size: .75rem; color: var(--muted, var(--d-muted)); margin-top: .4rem; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--d-paper); color: var(--d-ink); font-family: "Montserrat", system-ui, sans-serif; margin: 0; }
  .frame { max-width: 1100px; margin: 0 auto; padding: 2rem 16px 3rem; }
  .eyebrow { font: 500 .66rem "Geist Mono", ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--d-muted); margin-bottom: .5rem; }
  h1 { font-size: clamp(1.4rem, 2vw + .8rem, 1.9rem); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; margin-bottom: .4rem; }
  .sub { color: var(--d-muted); font-size: .9rem; margin-bottom: 1.5rem; }
  svg { display: block; width: 100%; height: auto; min-width: 640px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Diagrama · Taller de Gestión de Proyectos Digitales</p>
  <h1>La cadena de cifras</h1>
  <p class="sub">Del camino crítico a la línea base de costos.</p>
  <div class="scroll">
<svg viewBox="0 0 1080 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cadena-cifras-title cadena-cifras-desc"><title id="cadena-cifras-title">La cadena de cifras: del Gantt a la línea base de costos</title><desc id="cadena-cifras-desc">El camino crítico de 126 días hábiles da 25,2 semanas; el costo de recursos humanos dividido por esas semanas da USD 4.833 por semana; con eso se valora el impacto de cada riesgo, la suma de los valores esperados residuales da la reserva de USD 41.206 y, sumada al base de USD 200.633, la línea base de USD 241.839.</desc><defs><marker id="cadena-cifras-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah" points="0 0, 8 3, 0 6"/></marker><marker id="cadena-cifras-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah-accent" points="0 0, 8 3, 0 6"/></marker><marker id="cadena-cifras-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah-link" points="0 0, 8 3, 0 6"/></marker></defs><rect class="dg-bg" width="100%" height="100%"/><text class="dg-row" x="40" y="44" text-anchor="start">Si el jurado tira de un hilo, sale toda la cadena</text>
<path class="dg-line" d="M208 144 H248" marker-end="url(#cadena-cifras-arrow)"/>
<path class="dg-line" d="M416 144 H456" marker-end="url(#cadena-cifras-arrow)"/>
<path class="dg-line" d="M624 144 H664" marker-end="url(#cadena-cifras-arrow)"/>
<path class="dg-line-accent" d="M832 144 H872" marker-end="url(#cadena-cifras-arrow-accent)"/>
<rect class="dg-mask" x="40" y="88" width="168" height="112" rx="6"/>
<rect class="dg-box" x="40" y="88" width="168" height="112" rx="6"/>
<text class="dg-tag" x="196" y="108" text-anchor="end">06</text>
<text class="dg-name" x="124" y="131" text-anchor="middle">Gantt</text>
<text class="dg-sub" x="124" y="149" text-anchor="middle">126 días hábiles</text>
<text class="dg-sub" x="124" y="167" text-anchor="middle">= 25,2 semanas</text>
<rect class="dg-mask" x="248" y="88" width="168" height="112" rx="6"/>
<rect class="dg-box" x="248" y="88" width="168" height="112" rx="6"/>
<text class="dg-tag" x="404" y="108" text-anchor="end">10</text>
<text class="dg-name" x="332" y="131" text-anchor="middle">Costo semanal</text>
<text class="dg-sub" x="332" y="149" text-anchor="middle">RRHH 121.790 ÷ 25,2</text>
<text class="dg-sub" x="332" y="167" text-anchor="middle">= USD 4.833</text>
<rect class="dg-mask" x="456" y="88" width="168" height="112" rx="6"/>
<rect class="dg-box" x="456" y="88" width="168" height="112" rx="6"/>
<text class="dg-tag" x="612" y="108" text-anchor="end">09</text>
<text class="dg-name" x="540" y="131" text-anchor="middle">Impacto</text>
<text class="dg-sub" x="540" y="149" text-anchor="middle">semanas × 4.833</text>
<text class="dg-sub" x="540" y="167" text-anchor="middle">+ gastos afectados</text>
<rect class="dg-mask" x="664" y="88" width="168" height="112" rx="6"/>
<rect class="dg-box" x="664" y="88" width="168" height="112" rx="6"/>
<text class="dg-tag" x="820" y="108" text-anchor="end">09</text>
<text class="dg-name" x="748" y="131" text-anchor="middle">Reserva</text>
<text class="dg-sub" x="748" y="149" text-anchor="middle">EMV = impacto × prob.</text>
<text class="dg-sub" x="748" y="167" text-anchor="middle">Σ residual: 41.206</text>
<rect class="dg-mask" x="872" y="88" width="168" height="112" rx="6"/>
<rect class="dg-focal" x="872" y="88" width="168" height="112" rx="6"/>
<text class="dg-tag" x="1028" y="108" text-anchor="end">10</text>
<text class="dg-name" x="956" y="131" text-anchor="middle">Línea base</text>
<text class="dg-sub" x="956" y="149" text-anchor="middle">200.633 + 41.206</text>
<text class="dg-sub" x="956" y="167" text-anchor="middle">= USD 241.839</text>
<line class="dg-rule" x1="40" y1="264" x2="1040" y2="264"/>
<text class="dg-tag" x="40" y="292" text-anchor="start">LEYENDA</text>
<rect class="dg-box" x="128" y="280" width="20" height="16" rx="4"/>
<text class="dg-note" x="156" y="292" text-anchor="start">sección del TP (número arriba a la derecha)</text>
<rect class="dg-focal" x="472" y="280" width="20" height="16" rx="4"/>
<text class="dg-note" x="500" y="292" text-anchor="start">la cifra que se aprueba</text></svg>
  </div>
</div>
</body>
</html>
