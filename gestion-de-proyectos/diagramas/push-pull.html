<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push contra pull</title>
<script src="../assets/theme.js"></script>
<script src="../assets/suite-nav.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Diagram skin for diagram-design SVGs (profile "unicaba-cursada").
   Shared by clases/*.html, slides/* and diagramas/*.html. Self-contained: it does not need course.css.
   Light values = assets/course.css tokens; dark follows data-theme (theme.js) or the system. */
:root {
  --d-paper: #ffffff;
  --d-paper-2: #f8f1f5;
  --d-box: #ffffff;
  --d-ink: #24171f;
  --d-muted: #6a5764;
  --d-soft: #8d7a87;
  --d-rule: #e6d3df;
  --d-accent: #b83a95;
  --d-accent-ink: #9c2a7b;
  --d-accent-tint: rgba(184, 58, 149, .08);
  --d-link: #6b2fae;
  --d-link-tint: rgba(107, 47, 174, .08);
}
:root[data-theme="dark"] {
  --d-paper: #1a1218;
  --d-paper-2: #241a22;
  --d-box: #241a22;
  --d-ink: #f2e9ef;
  --d-muted: #b3a3ae;
  --d-soft: #8f7d89;
  --d-rule: #43303e;
  --d-accent: #f08fcf;
  --d-accent-ink: #f08fcf;
  --d-accent-tint: rgba(240, 143, 207, .10);
  --d-link: #b99af0;
  --d-link-tint: rgba(185, 154, 240, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --d-paper: #1a1218;
    --d-paper-2: #241a22;
    --d-box: #241a22;
    --d-ink: #f2e9ef;
    --d-muted: #b3a3ae;
    --d-soft: #8f7d89;
    --d-rule: #43303e;
    --d-accent: #f08fcf;
    --d-accent-ink: #f08fcf;
    --d-accent-tint: rgba(240, 143, 207, .10);
    --d-link: #b99af0;
    --d-link-tint: rgba(185, 154, 240, .10);
  }
}

/* Figure wrapper used by lessons */
figure.diagram { margin: 1.6rem 0; }
figure.diagram svg { display: block; width: 100%; height: auto; }
figure.diagram figcaption { font-family: "Montserrat", system-ui, sans-serif; font-size: .75rem; color: var(--muted, var(--d-muted)); margin-top: .5rem; }

/* SVG classes (all prefixed dg-) */
.dg-bg { fill: var(--d-paper); }
.dg-mask { fill: var(--d-paper); }
.dg-zone { fill: var(--d-paper-2); stroke: var(--d-rule); stroke-width: 1; }
.dg-rule { stroke: var(--d-rule); stroke-width: .8; fill: none; }

.dg-box { fill: var(--d-box); stroke: var(--d-ink); stroke-width: 1; }
.dg-store { fill: var(--d-paper-2); stroke: var(--d-muted); stroke-width: 1; }
.dg-focal { fill: var(--d-accent-tint); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-viol { fill: var(--d-link-tint); stroke: var(--d-link); stroke-width: 1; }
.dg-ghost { fill: none; stroke: var(--d-muted); stroke-width: 1; stroke-dasharray: 4 3; }
.dg-dot { fill: var(--d-paper-2); stroke: var(--d-muted); stroke-width: 1; }
.dg-dot-focal { fill: var(--d-accent); stroke: var(--d-accent); stroke-width: 1; }

.dg-line { stroke: var(--d-muted); stroke-width: 1.2; fill: none; }
.dg-line-accent { stroke: var(--d-accent); stroke-width: 1.2; fill: none; }
.dg-line-link { stroke: var(--d-link); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.dg-ah { fill: var(--d-muted); }
.dg-ah-accent { fill: var(--d-accent); }
.dg-ah-link { fill: var(--d-link); }

.dg-name { font: 600 16px "Montserrat", system-ui, sans-serif; fill: var(--d-ink); }
.dg-sub { font: 500 12px "Montserrat", system-ui, sans-serif; fill: var(--d-muted); }
.dg-row { font: 600 16px "Montserrat", system-ui, sans-serif; fill: var(--d-ink); }
.dg-tag { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-soft); letter-spacing: .08em; }
.dg-lbl { font: 400 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-muted); letter-spacing: .04em; }
.dg-lbl-accent { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-accent-ink); letter-spacing: .04em; }
.dg-lbl-link { font: 500 12px "Geist Mono", ui-monospace, monospace; fill: var(--d-link); letter-spacing: .04em; }
.dg-note { font: 500 12px "Montserrat", system-ui, sans-serif; fill: var(--d-muted); }
.dg-note-accent { font: 600 12px "Montserrat", system-ui, sans-serif; fill: var(--d-accent-ink); }

/* Catedra slide screenshots (clases/img/*.jpg) shown next to the own diagrams. */
figure.slide { margin: 1.4rem 0; }
figure.slide img { display: block; width: 100%; max-width: 720px; height: auto; border: 1px solid var(--rule, #e6d3df); border-radius: 6px; }
figure.slide figcaption { font-family: "Montserrat", system-ui, sans-serif; font-size: .75rem; color: var(--muted, var(--d-muted)); margin-top: .4rem; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--d-paper); color: var(--d-ink); font-family: "Montserrat", system-ui, sans-serif; margin: 0; }
  .frame { max-width: 1100px; margin: 0 auto; padding: 2rem 16px 3rem; }
  .eyebrow { font: 500 .66rem "Geist Mono", ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--d-muted); margin-bottom: .5rem; }
  h1 { font-size: clamp(1.4rem, 2vw + .8rem, 1.9rem); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; margin-bottom: .4rem; }
  .sub { color: var(--d-muted); font-size: .9rem; margin-bottom: 1.5rem; }
  svg { display: block; width: 100%; height: auto; min-width: 640px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Diagrama · Taller de Gestión de Proyectos Digitales</p>
  <h1>Push contra pull</h1>
  <p class="sub">Dónde se esconde y dónde se ve el cuello de botella.</p>
  <div class="scroll">
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="push-pull-title push-pull-desc"><title id="push-pull-title">Push contra pull: dónde se esconde el cuello de botella</title><desc id="push-pull-desc">En push cada etapa empuja trabajo a la siguiente sin mirar su capacidad y la cola se acumula frente a la etapa lenta. En pull cada etapa toma trabajo solo cuando tiene lugar bajo su límite de WIP, así que la etapa llena queda a la vista y frena a las anteriores.</desc><defs><marker id="push-pull-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah" points="0 0, 8 3, 0 6"/></marker><marker id="push-pull-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah-accent" points="0 0, 8 3, 0 6"/></marker><marker id="push-pull-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-ah-link" points="0 0, 8 3, 0 6"/></marker></defs><rect class="dg-bg" width="100%" height="100%"/><text class="dg-row" x="40" y="44" text-anchor="start">Push · se empuja trabajo sin mirar la capacidad</text>
<path class="dg-line" d="M280 96 H356" marker-end="url(#push-pull-arrow)"/>
<path class="dg-line" d="M600 96 H676" marker-end="url(#push-pull-arrow)"/>
<rect class="dg-mask" x="40" y="64" width="240" height="64" rx="6"/>
<rect class="dg-box" x="40" y="64" width="240" height="64" rx="6"/>
<text class="dg-name" x="160" y="92" text-anchor="middle">Análisis</text>
<text class="dg-sub" x="160" y="110" text-anchor="middle">termina y empuja</text>
<rect class="dg-mask" x="360" y="64" width="240" height="64" rx="6"/>
<rect class="dg-box" x="360" y="64" width="240" height="64" rx="6"/>
<text class="dg-name" x="480" y="92" text-anchor="middle">Desarrollo</text>
<text class="dg-sub" x="480" y="110" text-anchor="middle">termina y empuja</text>
<rect class="dg-mask" x="680" y="64" width="240" height="64" rx="6"/>
<rect class="dg-focal" x="680" y="64" width="240" height="64" rx="6"/>
<text class="dg-name" x="800" y="92" text-anchor="middle">Pruebas</text>
<text class="dg-sub" x="800" y="110" text-anchor="middle">cola: 9 ítems esperando</text>
<text class="dg-note-accent" x="800" y="156" text-anchor="middle">la cola crece y nadie la ve a tiempo</text>
<text class="dg-row" x="40" y="220" text-anchor="start">Pull · cada etapa toma trabajo cuando tiene lugar (límite de WIP)</text>
<path class="dg-line" d="M280 260 H356" marker-end="url(#push-pull-arrow)"/>
<path class="dg-line-link" d="M356 288 H284" marker-end="url(#push-pull-arrow-link)"/>
<path class="dg-line" d="M600 260 H676" marker-end="url(#push-pull-arrow)"/>
<path class="dg-line-link" d="M676 288 H604" marker-end="url(#push-pull-arrow-link)"/>
<rect class="dg-mask" x="40" y="240" width="240" height="64" rx="6"/>
<rect class="dg-box" x="40" y="240" width="240" height="64" rx="6"/>
<text class="dg-name" x="160" y="268" text-anchor="middle">Análisis</text>
<text class="dg-sub" x="160" y="286" text-anchor="middle">WIP 2 de 3 · toma si hay lugar</text>
<rect class="dg-mask" x="360" y="240" width="240" height="64" rx="6"/>
<rect class="dg-box" x="360" y="240" width="240" height="64" rx="6"/>
<text class="dg-name" x="480" y="268" text-anchor="middle">Desarrollo</text>
<text class="dg-sub" x="480" y="286" text-anchor="middle">WIP 3 de 3 · espera la señal</text>
<rect class="dg-mask" x="680" y="240" width="240" height="64" rx="6"/>
<rect class="dg-focal" x="680" y="240" width="240" height="64" rx="6"/>
<text class="dg-name" x="800" y="268" text-anchor="middle">Pruebas</text>
<text class="dg-sub" x="800" y="286" text-anchor="middle">WIP 2 de 2 · llena, frena</text>
<text class="dg-note" x="480" y="340" text-anchor="middle">La columna llena se ve en el tablero: ahí está el cuello de botella para atacar.</text>
<line class="dg-rule" x1="40" y1="404" x2="920" y2="404"/>
<text class="dg-tag" x="40" y="432" text-anchor="start">LEYENDA</text>
<path class="dg-line" d="M128 428 H152" marker-end="url(#push-pull-arrow)"/>
<text class="dg-note" x="160" y="432" text-anchor="start">trabajo</text>
<path class="dg-line-link" d="M240 428 H264" marker-end="url(#push-pull-arrow-link)"/>
<text class="dg-note" x="272" y="432" text-anchor="start">señal de capacidad (pull)</text>
<rect class="dg-focal" x="472" y="420" width="20" height="16" rx="4"/>
<text class="dg-note" x="500" y="432" text-anchor="start">cuello de botella</text></svg>
  </div>
</div>
</body>
</html>
