<head>
<meta charset="utf-8">

<title>Mapa de la Ciudad — prototipo</title>
<meta name="description" content="Prototipo conceptual con datos ficticios de un mapa interactivo de la Ciudad. Trabajo práctico académico.">
<!--
  Mapa de la Ciudad — prototipo (UN solo archivo: HTML + CSS + JS vanilla).
  Prototipo conceptual de un trabajo práctico académico. TODOS los datos son ficticios.
  No es un sitio oficial ni usa identidad institucional.

  Decisiones tomadas ante ambigüedades de las specs (la más simple, anotada acá):
  1. Reportar: elegir categoría pasa solo al paso 2; marcar el punto (clic en el mapa, «Usar mi hogar» o
     «Usar el centro del mapa») pasa solo al paso 3. Así el flujo completo son 4 toques (CA-03).
     El marcador sigue siendo arrastrable en el paso 3; «Cambiar…» vuelve a los pasos anteriores.
  2. Marcador de reporte: círculo con un glifo de ESTADO adentro (bandeja, reloj, flecha, tilde, «?»);
     la categoría se ve en la ficha. Así el estado no depende solo del color.
  3. Subte: estaciones Plaza Italia, Palermo y Ministro Carranza (línea D) con coordenadas verificadas en
     OpenStreetMap el 2026-10-13; el trazado entre ellas es esquemático y el estado es ficticio.
     «Estación cercana» del hogar = Plaza Italia (~1,1 km); no se inventó una estación.
  4. Puntos del seed ajustados a calles reales de Palermo (snap a la calle más cercana si estaban a >30 m).
  5. Texto libre del asistente: se evalúa en este orden subte → ciclovía → reporte → corte → «hoy/resumen» → evento,
     para que «¿Qué tengo para hacer hoy?» no caiga en «hacer» = eventos.
  6. En móvil (<768 px) la pestaña «Favoritos» se oculta de la barra inferior (quedan 5 íconos) y sus lugares
     aparecen al pie de «Explorar».
  7. Estados de un reporte ajeno usan un «próximo paso» redactado en tercera persona (los del seed están en segunda).
  8. Ruta (opcional, §2.6) y la regla de medición NO se implementan.
  9. Persistencia: solo el tema (claro/oscuro) en localStorage, envuelto en try/catch.
  10. `?hora=HH:MM` desplaza la hora del navegador solo para probar el asistente.
-->

<script>
/* Tema antes del primer pintado (evita destello). */
(function () {
  var t = null;
  try { t = localStorage.getItem('tema'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

#toasts { position: fixed; z-index: 4000; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.35); font-size: 14px; pointer-events: auto; }
.pop h3 { font-size: 15px; margin-bottom: 2px; }
.pop .row { margin-top: 8px; }
.pop .btn { min-height: 44px; }

/* Líneas del mapa (por clase, para poder usar variables CSS) */
.ln-cut { stroke: var(--danger); stroke-width: 6px; stroke-dasharray: 10 8; fill: none; }
.ln-bici { stroke: var(--ciclo); stroke-width: 5px; fill: none; }
.ln-obs { stroke: var(--warn); stroke-width: 5px; stroke-dasharray: 2 9; stroke-linecap: round; fill: none; }
.ln-sub { stroke: var(--subte); stroke-width: 3px; stroke-dasharray: 2 6; opacity: .85; fill: none; }
.ln-route { stroke: var(--accent); stroke-width: 5px; fill: none; }
.ln-hl { stroke: var(--accent); stroke-width: 16px; stroke-opacity: .35; fill: none; }
.mkwrap:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* Responsive */
@media (max-width: 767px) {
  .top { grid-template-columns: 1fr auto; grid-template-areas: "brand theme" "badge badge" "search search"; padding: 6px 12px; row-gap: 6px; }
  .brand { grid-area: brand; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .badge-top { display: inline-flex; grid-area: badge; justify-self: stretch; justify-content: center; }
  .badge-top .long { display: none; } .badge-top .short { display: inline; }
  .search { grid-area: search; max-width: none; }
  #themeBtn { grid-area: theme; }
  .badge-map { display: none; }
  .layout { grid-template-columns: 1fr; grid-template-rows: 1fr var(--nav-h); grid-template-areas: "map" "side"; }
  .side { border-right: 0; border-top: 1px solid var(--rule); }
  .side [role="tablist"] { flex-direction: row; height: var(--nav-h); }
  .tab { flex: 1; min-height: var(--nav-h); border-left: 0; border-top: 4px solid transparent; font-size: 11px; padding: 2px; min-width: 0; }
  .tab[aria-selected="true"] { border-left-color: transparent; border-top-color: var(--accent); }
  .tab[data-tab="favoritos"] { display: none; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: var(--nav-h); z-index: 1500; border-right: 0; border-top: 3px solid var(--accent);
    border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.25); height: calc(var(--sheet-pct, .5) * (100% - 0px));
  }
  .sheet-handle { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 44px; border: 0; background: transparent; touch-action: none; }
  .sheet-handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); }
  #tabpanel { padding: 0 12px 16px; }
  .fab { top: 8px; right: 8px; padding: 0 12px; }
  .fab .long { display: none; }
  .ctl { right: 8px; }
  #toasts { bottom: calc(var(--nav-h) + 12px); }
  .flow { grid-template-columns: 1fr; }
  .flow .arrow { transform: rotate(90deg); justify-self: center; }
}
@media (min-width: 768px) { .fab .short { display: none; } }

  var z = SEED.zona;

  var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(map);
  var ok = 0, bad = 0;

function selectItem(kind, id) {
  var it = getItem(kind, id); if (!it) return;
  var lk = LK[kind]; S.layers[lk] = true; if (S.chip !== 'todo' && S.chip !== CHIP_OF[kind]) S.chip = 'todo';
  applyLayers(); syncLayerUI();
  if (S.rep.view === 'wizard') cancelWizard(true);
  if (kind === 'rep') { S.rep.sel = id; S.rep.view = 'detail'; S.tab = 'reportes'; S.view = null; }
  else { S.sel = { kind: kind, id: id }; S.tab = 'explorar'; S.view = null; }
  if (mqMobile.matches && S.sheet === 2) setSheet(1);
  renderPanel({ focus: true });
  var c = coordOf(kind, id); if (map && c) { focusOn(c, 16); var m = M[kind + ':' + id]; if (m) m.openPopup(); }
}
function setSheet(i) {
  S.sheet = Math.max(0, Math.min(2, i));
  var pct = [0.2, 0.5, 0.9][S.sheet];
  $('#panel').style.setProperty('--sheet-pct', pct);
  $('#sheetHandle').setAttribute('aria-expanded', S.sheet > 0);
  updateSheetPx();
}
function updateSheetPx() {
  requestAnimationFrame(function () { $('#mapwrap').style.setProperty('--sheet-px', sheetPx() + 'px'); if (map) map.invalidateSize({ pan: false }); });
}

/* Reportar */
function startWizard() {
  S.rep.view = 'wizard'; S.rep.step = 1; S.rep.cat = null; S.rep.coord = null; S.rep.desc = ''; S.tab = 'reportes'; S.view = null;
  if (mqMobile.matches && S.sheet === 0) setSheet(1);
  renderPanel({ focus: true });
}
function cancelWizard(silent) {
  S.rep.view = 'list'; S.rep.step = 1; S.rep.cat = null; S.rep.coord = null; S.rep.desc = '';
  if (!silent) renderPanel({ focus: true }); else syncDraft();
}
function setCoord(c) {
  if (S.rep.view !== 'wizard') return;
  S.rep.coord = c; if (S.rep.cat) S.rep.step = 3; else S.rep.step = 1;
  renderPanel({ focus: true });
  if (map && c) focusOn(c, map.getZoom());
}
function syncDraft() {
  if (!map) return;
  var on = S.rep.view === 'wizard' && S.rep.coord && S.tab === 'reportes' && !S.view;
  if (!on) { if (draft) { map.removeLayer(draft); draft = null; } return; }
  if (!draft) {
    draft = L.marker(S.rep.coord, { draggable: true, keyboard: true, title: 'Ubicación del reporte (arrastrable)', icon: divIcon('<div class="draft"></div><span class="sr">Ubicación del reporte</span>', 30, 30, 15, 30) }).addTo(map);
    draft.on('dragend', function () { var ll = draft.getLatLng(); S.rep.coord = [ll.lat, ll.lng]; var s = $('#tabpanel'); if (S.rep.step === 3) renderPanel({ keepScroll: true }); });
  } else draft.setLatLng(S.rep.coord);
}
function sendReport() {
  var R = S.rep; if (!R.cat || !R.coord) return;
  var r = { id: 'n' + (++nid), categoria: R.cat, titulo: catName(R.cat), descripcion: R.desc.trim(), coord: R.coord, estado: 'recibido', creadoMs: ahora(), conf: 0, no: 0, voto: null, usuario: 'vos (seudónimo)', mio: true, area: null };
  S.reports.push(r); if (map) { addReportMarker(r); S.layers.reportes = true; if (S.chip !== 'todo' && S.chip !== 'reportes') S.chip = 'todo'; applyLayers(); syncLayerUI(); }
  R.view = 'detail'; R.sel = r.id; R.step = 1; R.cat = null; R.coord = null; R.desc = '';
  toast('Recibimos tu reporte. Podés seguirlo en «Mis reportes».');
  renderPanel({ focus: true });
  timers.push(setTimeout(function () { if (r.estado === 'recibido') setEstado(r, 'revisando'); }, 5000));
}
function setEstado(r, e) {
  r.estado = e; if (e === 'derivado' && !r.area) r.area = AREA_POR_CAT[r.categoria] || 'Espacio Público';
  toast(r.mio ? 'Tu reporte pasó a: ' + estadoObj(e).texto : 'El reporte «' + r.titulo + '» pasó a: ' + estadoObj(e).texto);
  afterChange(r);
}
function afterChange(r) {
  refreshReportMarker(r);
  if (S.tab === 'reportes' || S.tab === 'explorar' || S.tab === 'hogar') renderPanel({ keepScroll: true });
}
function checkThreshold(r) { if ((r.estado === 'recibido' || r.estado === 'revisando') && r.conf >= 3) setEstado(r, 'derivado'); }
function vote(kind, id) {
  var r = repById(id); if (!r || r.mio || r.voto || r.estado === 'resuelto') return;
  r.voto = kind; if (kind === 'ok') r.conf++; else r.no++;
  toast('Gracias, ya registramos tu respuesta.');
  var before = r.estado; checkThreshold(r); if (r.estado === before) afterChange(r);
}
function demoConfirm() {
  var r = S.rep.sel && repById(S.rep.sel); if (!r || (r.estado !== 'recibido' && r.estado !== 'revisando')) return;
  r.conf++; toast('Otra persona confirmó que sigue vigente (simulado).');
  var before = r.estado; checkThreshold(r); if (r.estado === before) afterChange(r);
}
function demoAdvance() {
  var r = S.rep.sel && repById(S.rep.sel); if (!r || r.estado === 'resuelto') return;
  setEstado(r, ESTADOS[ESTADOS.indexOf(r.estado) + 1]);
}
function resetDemo() {
  timers.forEach(clearTimeout); timers = [];
  if (map) { Object.keys(M).forEach(function (k) { if (k.indexOf('rep:') === 0) { G.reportes.removeLayer(M[k]); delete M[k]; } }); routeLayer.clearLayers(); map.closePopup(); }
  buildData(); if (map) S.reports.forEach(addReportMarker);
  S.rep = { view: 'list', step: 1, cat: null, coord: null, desc: '', sel: null }; S.sel = null; S.route = false; S.chat = []; S.askDraft = '';
  S.chip = 'todo'; Object.keys(S.layers).forEach(function (k) { S.layers[k] = true; }); applyLayers();
  toast('Demostración reiniciada.'); renderAll();
}

/* Fuentes */
function simulate(id) {
  var f = SEED.fuentes.filter(function (x) { return x.id === id; })[0]; if (!f) return;
  S.src[id].estado = 'actualizado'; S.src[id].syncMs = ahora();
  toast('Se actualizó: ' + f.capa_nombre);
  renderPanel({ keepScroll: true }); renderLayerMenu(); refreshOpenPopup();
}
function seeLayer(id) {
  var f = SEED.fuentes.filter(function (x) { return x.id === id; })[0]; if (!f) return;
  var k = CAPA_KEY[f.capa]; S.layers[k] = true; if (S.chip !== 'todo' && S.chip !== k) S.chip = 'todo'; applyLayers(); syncLayerUI();
  closeArea(); if (map) map.setView(SEED.zona.centro, SEED.zona.zoom, { animate: false });
  if (mqMobile.matches) setSheet(0);
}
function closeArea() { S.view = null; S.tab = S.prevTab || 'capas'; renderPanel({ focus: true }); }

/* ───────────────────────── Eventos globales ───────────────────────── */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, arg = b.dataset.arg;
  if (b.tagName === 'A') e.preventDefault();
  var p;
  switch (a) {
    case 'chip': S.chip = arg; applyLayers(); renderPanel({ keepScroll: true }); break;
    case 'sel': p = arg.split(':'); selectItem(p[0], p[1]); break;
    case 'close-sel': S.sel = null; if (map) map.closePopup(); renderPanel({ keepScroll: true }); break;
    case 'rep-start': startWizard(); break;
    case 'rep-cat': S.rep.cat = arg; S.rep.step = S.rep.coord ? 3 : 2; renderPanel({ focus: true }); break;
    case 'rep-home': setCoord(HOME.slice()); break;
    case 'rep-center': if (map) { var c = map.getCenter(); setCoord([c.lat, c.lng]); } else setCoord(HOME.slice()); break;
    case 'rep-step': S.rep.step = +arg; renderPanel({ focus: true }); break;
    case 'rep-cancel': cancelWizard(); break;
    case 'rep-send': sendReport(); break;
    case 'rep-open': S.rep.sel = arg; selectItem('rep', arg); break;
    case 'rep-list': S.rep.view = 'list'; renderPanel({ focus: true }); break;
    case 'vote': p = arg.split(':'); vote(p[0], p[1]); break;
    case 'reopen': var rr = repById(arg); if (rr) { rr.estado = 'recibido'; rr.conf = 0; toast('Reabriste tu reporte: pasó a Recibido.'); afterChange(rr); timers.push(setTimeout(function () { if (rr.estado === 'recibido') setEstado(rr, 'revisando'); }, 5000)); } break;
    case 'demo-confirm': demoConfirm(); break;
    case 'demo-advance': demoAdvance(); break;
    case 'demo-reset': resetDemo(); break;
    case 'home-route': toggleRoute(); break;
    case 'route-on': if (S.tab !== 'hogar') setTab('hogar'); if (!S.route) toggleRoute(); break;
    case 'ask-summary': runAsk('hoy', '¿Qué tengo para hacer hoy?', true); break;
    case 'ask': runAsk(arg, QUICK.filter(function (q) { return q[0] === arg; })[0][1]); break;
    case 'area-open': S.prevTab = S.tab; S.view = 'area'; renderPanel({ focus: true }); renderTabs(); break;
    case 'area-back': closeArea(); break;
    case 'src-sim': simulate(arg); break;
    case 'src-see': seeLayer(arg); break;
  }
}, true);
document.addEventListener('change', function (e) {
  var i = e.target.closest('input[data-layer]'); if (!i) return;
  S.layers[i.dataset.layer] = i.checked; applyLayers(); syncLayerUI();
});
document.addEventListener('toggle', function (e) { if (e.target.id === 'demoBox') S.demoOpen = e.target.open; }, true);   // recuerda si el panel de demo está abierto
document.addEventListener('input', function (e) {
  if (e.target.id === 'repDesc') {
    S.rep.desc = e.target.value; var c = $('#repCount'); if (c) c.textContent = e.target.value.length + ' / 140 caracteres';
  }
});
document.addEventListener('submit', function (e) {
  if (e.target.id === 'askForm') {
    e.preventDefault(); var i = $('#askInput'), v = i.value.trim(); if (!v) return; i.value = ''; S.askDraft = '';
    runAsk(classify(v), v);
  }
});
$('#tablist').addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]'); if (!t) return;
  if (t.dataset.tab === 'reportes' && S.rep.view === 'detail') S.rep.view = 'list';   // volver a la lista al tocar la pestaña
  setTab(t.dataset.tab);
});
$('#tablist').addEventListener('keydown', function (e) {
  var tabs = Array.prototype.filter.call(document.querySelectorAll('#tablist .tab'), function (t) { return t.offsetParent !== null; });
  var i = tabs.indexOf(document.activeElement); if (i < 0) return;
  var n = null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (i + 1) % tabs.length;
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = tabs.length - 1;
  if (n === null) return; e.preventDefault(); setTab(tabs[n].dataset.tab); tabs[n].focus();
});

/* Tema */
function setTheme(t, persist) {
  document.documentElement.setAttribute('data-theme', t);
  var b = $('#themeBtn'); b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); b.setAttribute('aria-label', t === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  if (persist) { try { localStorage.setItem('tema', t); } catch (e) {} }
}
$('#themeBtn').addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) { var s = null; try { s = localStorage.getItem('tema'); } catch (x) {} if (!s) setTheme(e.matches ? 'dark' : 'light', false); });

/* Menú de capas y ubicación */
$('#layersBtn').addEventListener('click', function () {
  var m = $('#layerMenu'), open = m.hidden; m.hidden = !open; this.setAttribute('aria-expanded', open);
  if (open) { var f = m.querySelector('input'); if (f) f.focus(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var m = $('#layerMenu'); if (!m.hidden) { m.hidden = true; $('#layersBtn').setAttribute('aria-expanded', 'false'); $('#layersBtn').focus(); }
    closeResults();
  }
});
document.addEventListener('click', function (e) {
  var m = $('#layerMenu'); if (!m.hidden && !e.target.closest('#ctl')) { m.hidden = true; $('#layersBtn').setAttribute('aria-expanded', 'false'); }
  if (!e.target.closest('.search')) closeResults();
});
$('#locateBtn').addEventListener('click', function () {
  setTab('hogar');
  if (map) {
    if (!youMarker) youMarker = L.marker(HOME, { icon: divIcon('<div class="you"></div><span class="sr">Mi ubicación (ficticia)</span>', 18, 18, 9, 9), keyboard: false, interactive: false }).addTo(map);
    focusOn(HOME, 16);
  }
  toast('Mi ubicación es ficticia: te llevamos a Mi hogar.');
});

/* Hoja inferior (móvil) */
(function () {
  var h = $('#sheetHandle'), y0 = null, moved = false;
  h.addEventListener('pointerdown', function (e) { y0 = e.clientY; moved = false; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', function (e) { if (y0 !== null && Math.abs(e.clientY - y0) > 30) moved = true; });
  h.addEventListener('pointerup', function (e) {
    if (y0 === null) return; var dy = e.clientY - y0; y0 = null;
    if (Math.abs(dy) > 30) { setSheet(S.sheet + (dy < 0 ? 1 : -1)); e.preventDefault(); h.dataset.skip = '1'; setTimeout(function () { delete h.dataset.skip; }, 50); }
  });
  h.addEventListener('click', function () { if (h.dataset.skip) return; setSheet(S.sheet >= 2 ? 0 : S.sheet + 1); });
})();
function onBreakpoint() {
  $('#tablist').setAttribute('aria-orientation', mqMobile.matches ? 'horizontal' : 'vertical');
  if (mqMobile.matches && S.tab === 'favoritos') S.tab = 'explorar';
  if (mqMobile.matches) setSheet(S.sheet); else { $('#mapwrap').style.setProperty('--sheet-px', '0px'); if (map) map.invalidateSize({ pan: false }); }
  renderPanel({ keepScroll: true });
}
mqMobile.addEventListener('change', onBreakpoint);
window.addEventListener('resize', function () { updateSheetPx(); });

/* Buscador (solo datos locales) */
var resActive = -1, resData = [];
function closeResults() { var r = $('#results'); r.hidden = true; $('#q').setAttribute('aria-expanded', 'false'); $('#q').removeAttribute('aria-activedescendant'); resActive = -1; }
function searchData(q) {
  var t = norm(q.trim()); if (!t) return [];
  var pool = [];
  S.reports.forEach(function (r) { pool.push({ k: 'rep', id: r.id, t: r.titulo, s: 'Reporte · ' + catName(r.categoria), x: [r.titulo, r.descripcion, catName(r.categoria)].join(' ') }); });
  EV.forEach(function (e) { pool.push({ k: 'evt', id: e.id, t: e.titulo, s: 'Evento · ' + e.anfitrion, x: [e.titulo, e.anfitrion, e.categoria, e.descripcion].join(' ') }); });
  CUT.forEach(function (c) { pool.push({ k: 'cut', id: c.id, t: c.titulo, s: 'Corte de tránsito', x: [c.titulo, c.motivo, c.cerca_de || ''].join(' ') }); });
  BICI.forEach(function (b) { pool.push({ k: 'bici', id: b.id, t: b.nombre, s: 'Ciclovía', x: b.nombre + ' ciclovia bicicleta' }); });
  SUB.estaciones.forEach(function (s) { pool.push({ k: 'sub', id: s.id, t: 'Estación ' + s.nombre, s: 'Subte · línea D', x: 'estacion ' + s.nombre + ' subte linea d' }); });
  SEED.favoritos.forEach(function (f) { var l = HOGAR.lugares.filter(function (z) { return (f.id === 'fav-escuela' && z.id === 'escuela') || (f.id === 'fav-plaza' && z.id === 'plaza'); })[0]; pool.push({ k: 'fav', id: f.id, t: f.nombre, s: 'Favorito' + (l ? ' · ' + l.nombre : ''), x: f.nombre + ' ' + (l ? l.nombre : '') + ' lugar favorito' }); });
  return pool.map(function (p) { var n = norm(p.x), tt = norm(p.t); return { p: p, sc: tt.indexOf(t) === 0 ? 0 : (tt.indexOf(t) > 0 ? 1 : (n.indexOf(t) >= 0 ? 2 : 9)) }; })
    .filter(function (o) { return o.sc < 9; }).sort(function (a, b) { return a.sc - b.sc; }).slice(0, 8).map(function (o) { return o.p; });
}
function showResults(q) {
  var r = $('#results'); resData = searchData(q); resActive = -1;
  if (!q.trim()) { closeResults(); return; }
  r.innerHTML = resData.length ? resData.map(function (x, i) { return '<li role="option" id="opt' + i + '" data-i="' + i + '" aria-selected="false">' + esc(x.t) + '<small>' + esc(x.s) + '</small></li>'; }).join('')
    : '<li role="presentation" style="cursor:default">Sin resultados en los datos de ejemplo<small>Esta búsqueda no usa servicios externos.</small></li>';
  r.hidden = false; $('#q').setAttribute('aria-expanded', 'true');
}
function pick(i) { var x = resData[i]; if (!x) return; closeResults(); $('#q').value = x.t; selectItem(x.k, x.id); }
function setActive(i) {
  var opts = document.querySelectorAll('#results [role=option]'); if (!opts.length) return;
  resActive = (i + opts.length) % opts.length;
  opts.forEach(function (o, j) { o.setAttribute('aria-selected', j === resActive); });
  $('#q').setAttribute('aria-activedescendant', 'opt' + resActive); opts[resActive].scrollIntoView({ block: 'nearest' });
}
$('#q').addEventListener('input', function () { showResults(this.value); });
$('#q').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); if ($('#results').hidden) showResults(this.value); setActive(resActive + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(resActive - 1); }
});
$('#results').addEventListener('click', function (e) { var li = e.target.closest('[data-i]'); if (li) pick(+li.dataset.i); });
$('#searchForm').addEventListener('submit', function (e) {
  e.preventDefault(); showResults($('#q').value);
  if (resData.length) pick(resActive >= 0 ? resActive : 0);
});

/* ───────────────────────── Arranque ───────────────────────── */
setTheme(document.documentElement.getAttribute('data-theme'), false);
if (!HAS_FUENTES) { /* la vista «Del lado del área» es opcional: sin `fuentes` no se muestra el enlace */ }
initMap();
$('#tablist').setAttribute('aria-orientation', mqMobile.matches ? 'horizontal' : 'vertical');
if (mqMobile.matches) setSheet(0);
renderAll();
setInterval(function () {                               // refresca textos relativos de eventos cada minuto
  if (map) EV.forEach(function (e) { if (M['evt:' + e.id]) M['evt:' + e.id].setIcon(eventIcon(e)); });
}, 60000);
window.__mock = { S: S, ahora: ahora };                  // solo para pruebas manuales en la consola
})();

</script>
</body>
