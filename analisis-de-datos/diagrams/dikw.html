<p class="eyebrow">Lección 0005 · del dato al insight</p><h1>¿Datos e información son lo mismo? No.</h1><p class="subtitle">La pirámide DIKW: cada nivel agrega valor sobre el anterior. Un insight es información de valor para decidir.</p><div class="frame"><svg class="dg" viewBox="0 0 800 352" style="max-width:800px;margin-inline:auto" role="img" aria-labelledby="dikw-title dikw-desc" xmlns="http://www.w3.org/2000/svg"><title id="dikw-title">Pirámide DIKW</title><desc id="dikw-desc">Pirámide de cuatro niveles, de datos en la base a sabiduría en la cima, con el propósito de cada nivel; información está destacada.</desc><defs><marker id="dikw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="dikw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="dikw-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="edge" d="M16,300 L16,64" marker-end="url(#dikw-arrow)"/><text class="eyebrow" x="8" y="48" text-anchor="start">MÁS VALOR</text><text class="eyebrow" x="560" y="48" text-anchor="start">PROPÓSITO DE CADA NIVEL</text><polygon class="layer" points="32,312 512,312 464,248 80,248"/><text class="name" x="272" y="278" text-anchor="middle">Datos</text><text class="sub" x="272" y="292" text-anchor="middle">elementos discontinuos</text><line class="leader" x1="496" y1="280" x2="548" y2="280"/><text class="body" x="560" y="278" text-anchor="start">Registrar hechos y eventos</text><text class="body" x="560" y="294" text-anchor="start">del mundo real</text><polygon class="layer-focal" points="80,248 464,248 416,184 128,184"/><text class="name" x="272" y="214" text-anchor="middle">Información</text><text class="sub-accent" x="272" y="228" text-anchor="middle">datos procesados</text><line class="leader" x1="448" y1="216" x2="548" y2="216"/><text class="name" x="560" y="214" text-anchor="start">Dar contexto y significado</text><text class="name" x="560" y="230" text-anchor="start">a los datos</text><polygon class="layer" points="128,184 416,184 368,120 176,120"/><text class="name" x="272" y="150" text-anchor="middle">Conocimiento</text><text class="sub" x="272" y="164" text-anchor="middle">aplicar la información</text><line class="leader" x1="400" y1="152" x2="548" y2="152"/><text class="body" x="560" y="150" text-anchor="start">Resolver problemas y</text><text class="body" x="560" y="166" text-anchor="start">generar valor</text><polygon class="layer" points="176,120 368,120 320,56 224,56"/><text class="name" x="272" y="92" text-anchor="middle">Sabiduría</text><line class="leader" x1="352" y1="88" x2="548" y2="88"/><text class="body" x="560" y="86" text-anchor="start">Juicio y comprensión profunda</text><text class="body" x="560" y="102" text-anchor="start">para decisiones estratégicas</text><text class="sub" x="16" y="340" text-anchor="start">Fuente: Hey, «The Data, Information, Knowledge, Wisdom Chain», citado en los slides.</text></svg></div><footer><a href="../lessons/0005-del-dato-al-insight.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos I · UNICABA 2026</span></footer>
