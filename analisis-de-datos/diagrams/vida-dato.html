<p class="eyebrow">Lección 0001 · calidad de datos</p><h1>La vida del dato</h1><p class="subtitle">Seguí al dato desde que nace hasta que se usa: en qué momento falló te dice qué dimensión es.</p><div class="frame"><svg class="dg" viewBox="0 0 720 412" style="max-width:720px;margin-inline:auto" role="img" aria-labelledby="vida-dato-title vida-dato-desc" xmlns="http://www.w3.org/2000/svg"><title id="vida-dato-title">La vida del dato y las dimensiones de calidad</title><desc id="vida-dato-desc">Tres etapas del dato (nace, viaja, se usa) con la dimensión de calidad que falla en cada una, y una banda con completitud, duplicados y precisión, que pueden fallar en cualquier etapa.</desc><defs><marker id="vida-dato-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="vida-dato-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="vida-dato-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="edge" d="M232,44 L256,44" marker-end="url(#vida-dato-arrow)"/><path class="edge" d="M464,44 L488,44" marker-end="url(#vida-dato-arrow)"/><rect class="zone" x="24" y="244" width="672" height="92" rx="8"/><text class="eyebrow" x="40" y="262" text-anchor="start">EN CUALQUIER ETAPA</text><rect class="mask" x="24" y="24" width="208" height="40" rx="6"/><rect class="store" x="24" y="24" width="208" height="40" rx="6"/><text class="name" x="128" y="48" text-anchor="middle">Nace</text><text class="sub" x="128" y="80" text-anchor="middle">se genera o se carga</text><rect class="mask" x="256" y="24" width="208" height="40" rx="6"/><rect class="store" x="256" y="24" width="208" height="40" rx="6"/><text class="name" x="360" y="48" text-anchor="middle">Viaja / se guarda</text><text class="sub" x="360" y="80" text-anchor="middle">transferencia · almacenamiento</text><rect class="mask" x="488" y="24" width="208" height="40" rx="6"/><rect class="store" x="488" y="24" width="208" height="40" rx="6"/><text class="name" x="592" y="48" text-anchor="middle">Se usa</text><text class="sub" x="592" y="80" text-anchor="middle">reportes · decisiones</text><rect class="mask" x="24" y="96" width="208" height="56" rx="6"/><rect class="focal" x="24" y="96" width="208" height="56" rx="6"/><text class="name" x="128" y="122" text-anchor="middle">Configuración</text><text class="sub-accent" x="128" y="136" text-anchor="middle">¿se generó del modo correcto?</text><rect class="mask" x="256" y="96" width="208" height="56" rx="6"/><rect class="focal" x="256" y="96" width="208" height="56" rx="6"/><text class="name" x="360" y="122" text-anchor="middle">Integridad</text><text class="sub-accent" x="360" y="136" text-anchor="middle">¿llegó sin romperse?</text><rect class="mask" x="488" y="96" width="208" height="56" rx="6"/><rect class="node" x="488" y="96" width="208" height="56" rx="6"/><text class="name" x="592" y="122" text-anchor="middle">Tempestividad</text><text class="sub" x="592" y="136" text-anchor="middle">¿está disponible a tiempo?</text><rect class="mask" x="488" y="168" width="208" height="56" rx="6"/><rect class="node" x="488" y="168" width="208" height="56" rx="6"/><text class="name" x="592" y="194" text-anchor="middle">Consistencia</text><text class="sub" x="592" y="208" text-anchor="middle">¿dice lo mismo en todos lados?</text><text class="note" x="128" y="176" text-anchor="middle">nunca estuvo bien</text><text class="note" x="360" y="176" text-anchor="middle">estuvo bien, se rompió después</text><rect class="mask" x="40" y="272" width="200" height="48" rx="6"/><rect class="node" x="40" y="272" width="200" height="48" rx="6"/><text class="name" x="140" y="294" text-anchor="middle">Completitud</text><text class="sub" x="140" y="308" text-anchor="middle">¿están los obligatorios?</text><rect class="mask" x="260" y="272" width="200" height="48" rx="6"/><rect class="node" x="260" y="272" width="200" height="48" rx="6"/><text class="name" x="360" y="294" text-anchor="middle">Duplicados</text><text class="sub" x="360" y="308" text-anchor="middle">¿se repite sin necesidad?</text><rect class="mask" x="480" y="272" width="200" height="48" rx="6"/><rect class="node" x="480" y="272" width="200" height="48" rx="6"/><text class="name" x="580" y="294" text-anchor="middle">Precisión</text><text class="sub" x="580" y="308" text-anchor="middle">¿refleja la realidad?</text><text class="note" x="360" y="364" text-anchor="middle">Configuración vs integridad: ¿estuvo bien alguna vez?</text><line class="rule" x1="24" y1="380" x2="696" y2="380"/><text class="eyebrow" x="24" y="404" text-anchor="start">LEYENDA</text><rect class="focal" x="104" y="396" width="16" height="12" rx="3"/><text class="sub" x="128" y="405" text-anchor="start">el par que se confunde en el choice</text></svg></div><footer><a href="../lessons/0001-dimensiones-de-calidad.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos I · UNICABA 2026</span></footer>
