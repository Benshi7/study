<p class="eyebrow">Lección 0011 · Matplotlib</p><h1>La palabra del enunciado elige el gráfico</h1><p class="subtitle">Buscá la palabra pista: evolución → líneas, comparar → barras, distribuye → histograma, se asocia → dispersión.</p><div class="frame"><svg class="dg" viewBox="0 0 800 400" style="max-width:800px;margin-inline:auto" role="img" aria-labelledby="graficos-title graficos-desc" xmlns="http://www.w3.org/2000/svg"><title id="graficos-title">Qué gráfico para qué pregunta</title><desc id="graficos-desc">Cuatro tarjetas con un mini gráfico de ejemplo: líneas para evolución en el tiempo, barras para comparar categorías, histograma (destacado) para ver cómo se distribuye una variable, y dispersión para ver si dos variables se asocian; cada una con sus palabras pista y una pregunta tipo.</desc><defs><marker id="graficos-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="graficos-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="graficos-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><rect class="mask" x="24" y="24" width="176" height="308" rx="6"/><rect class="node" x="24" y="24" width="176" height="308" rx="6"/><text class="name" x="40" y="46" text-anchor="start">Líneas</text><text class="sub" x="40" y="62" text-anchor="start">plt.plot()</text><path class="axis" d="M44,80 L44,160 L184,160"/><polyline class="series" points="54,140 71,128 88,133.6 105,116 122,120 139,104 156,100.8 173,86.4"/><circle class="mark" cx="54" cy="140" r="2.2"/><circle class="mark" cx="71" cy="128" r="2.2"/><circle class="mark" cx="88" cy="133.6" r="2.2"/><circle class="mark" cx="105" cy="116" r="2.2"/><circle class="mark" cx="122" cy="120" r="2.2"/><circle class="mark" cx="139" cy="104" r="2.2"/><circle class="mark" cx="156" cy="100.8" r="2.2"/><circle class="mark" cx="173" cy="86.4" r="2.2"/><text class="label" x="184" y="171" text-anchor="end">tiempo →</text><text class="eyebrow" x="40" y="190" text-anchor="start">PALABRAS PISTA</text><text class="field" x="40" y="206" text-anchor="start">evolución</text><text class="field" x="40" y="220" text-anchor="start">tendencia</text><text class="field" x="40" y="234" text-anchor="start">en el tiempo</text><text class="field" x="40" y="248" text-anchor="start">día por día / por mes</text><line class="rule" x1="40" y1="268" x2="184" y2="268"/><text class="eyebrow" x="40" y="284" text-anchor="start">PREGUNTA TIPO</text><foreignObject x="40" y="290" width="144" height="56"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">Mostrar la evolución de las ventas día por día.</div></foreignObject><rect class="mask" x="216" y="24" width="176" height="308" rx="6"/><rect class="node" x="216" y="24" width="176" height="308" rx="6"/><text class="name" x="232" y="46" text-anchor="start">Barras</text><text class="sub" x="232" y="62" text-anchor="start">plt.bar()</text><path class="axis" d="M236,80 L236,160 L376,160"/><rect class="mark" x="248" y="112" width="20" height="48"/><text class="label" x="258" y="171" text-anchor="middle">A</text><rect class="mark" x="280" y="86.4" width="20" height="73.6"/><text class="label" x="290" y="171" text-anchor="middle">B</text><rect class="mark" x="312" y="128" width="20" height="32"/><text class="label" x="322" y="171" text-anchor="middle">C</text><rect class="mark" x="344" y="100" width="20" height="60"/><text class="label" x="354" y="171" text-anchor="middle">D</text><text class="eyebrow" x="232" y="190" text-anchor="start">PALABRAS PISTA</text><text class="field" x="232" y="206" text-anchor="start">comparar</text><text class="field" x="232" y="220" text-anchor="start">por categoría</text><text class="field" x="232" y="234" text-anchor="start">cuál es mayor / menor</text><text class="field" x="232" y="248" text-anchor="start">por producto</text><line class="rule" x1="232" y1="268" x2="376" y2="268"/><text class="eyebrow" x="232" y="284" text-anchor="start">PREGUNTA TIPO</text><foreignObject x="232" y="290" width="144" height="56"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">Comparar el total vendido por producto.</div></foreignObject><rect class="mask" x="408" y="24" width="176" height="308" rx="6"/><rect class="focal" x="408" y="24" width="176" height="308" rx="6"/><text class="name" x="424" y="46" text-anchor="start">Histograma</text><text class="sub-accent" x="424" y="62" text-anchor="start">plt.hist()</text><path class="axis" d="M428,80 L428,160 L568,160"/><rect class="mark-accent" x="434" y="150.4" width="16" height="9.6" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="450" y="136" width="16" height="24" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="466" y="113.6" width="16" height="46.4" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="482" y="88" width="16" height="72" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="498" y="80" width="16" height="80" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="514" y="105.6" width="16" height="54.4" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="530" y="131.2" width="16" height="28.8" style="stroke: var(--dg-paper); stroke-width: 1"/><rect class="mark-accent" x="546" y="148.8" width="16" height="11.2" style="stroke: var(--dg-paper); stroke-width: 1"/><text class="label" x="568" y="171" text-anchor="end">edad (intervalos) →</text><text class="eyebrow" x="424" y="190" text-anchor="start">PALABRAS PISTA</text><text class="sub-accent" x="424" y="206" text-anchor="start">cómo se distribuye</text><text class="field" x="424" y="220" text-anchor="start">concentración</text><text class="fie 268"/><text class="eyebrow" x="616" y="284" text-anchor="start">PREGUNTA TIPO</text><foreignObject x="616" y="290" width="144" height="56"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">¿Más horas de estudio se asocian con mejores notas?</div></foreignObject><text class="note" x="400" y="360" text-anchor="middle">Barras = categorías separadas · histograma = intervalos numéricos pegados.</text><text class="note" x="400" y="380" text-anchor="middle">Trampa: “dispersión” de UNA variable (qué tan desparramada está) es histograma; dos variables es scatter.</text></svg></div><footer><a href="../lessons/0011-pandas-y-matplotlib.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos I · UNICABA 2026</span></footer>
