<p class="eyebrow">Lección 0010 · manejo de errores</p><h1>Qué pasa cuando algo falla dentro del try</h1><p class="subtitle">El error corta el try en esa línea: las siguientes no corren. Después, el programa sigue igual.</p><div class="frame"><svg class="dg" viewBox="0 0 800 488" style="max-width:800px;margin-inline:auto" role="img" aria-labelledby="try-except-title try-except-desc" xmlns="http://www.w3.org/2000/svg"><title id="try-except-title">Flujo de try / except</title><desc id="try-except-desc">Diagrama de flujo: si una línea del try falla, se salta al except sin ejecutar el resto del try; si no falla, el except se saltea; en ambos casos el programa sigue.</desc><defs><marker id="try-except-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="try-except-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="try-except-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="edge" d="M320,64 L320,96" marker-end="url(#try-except-arrow)"/><path class="edge" d="M320,144 L320,168" marker-end="url(#try-except-arrow)"/><path class="edge-accent" d="M432,212 L520,212" marker-end="url(#try-except-arrow-accent)"/><rect class="mask" x="466" y="192" width="20" height="12" rx="2"/><text class="label-accent" x="476" y="201" text-anchor="middle">SÍ</text><path class="edge" d="M320,256 L320,296" marker-end="url(#try-except-arrow)"/><rect class="mask" x="328" y="270" width="20" height="12" rx="2"/><text class="label" x="338" y="279" text-anchor="middle">NO</text><path class="edge" d="M320,344 L320,392"/><path class="edge" d="M640,236 L640,388 Q640,396 632,396 L324,396"/><path class="edge" d="M320,400 L320,424" marker-end="url(#try-except-arrow)"/><rect class="mask" x="240" y="24" width="160" height="40" rx="20"/><rect class="node" x="240" y="24" width="160" height="40" rx="20"/><text class="name" x="320" y="48" text-anchor="middle">Entra al try</text><rect class="mask" x="200" y="96" width="240" height="48" rx="6"/><rect class="node" x="200" y="96" width="240" height="48" rx="6"/><text class="name" x="320" y="118" text-anchor="middle">Ejecuta el try línea a línea</text><text class="sub" x="320" y="132" text-anchor="middle">print(&#x27;2&#x27;) → 10 / 0 → …</text><polygon class="mask" points="320,168 432,212 320,256 208,212"/><polygon class="node" points="320,168 432,212 320,256 208,212"/><text class="name" x="320" y="216" text-anchor="middle">¿Alguna línea falla?</text><rect class="mask" x="520" y="188" width="240" height="48" rx="6"/><rect class="focal" x="520" y="188" width="240" height="48" rx="6"/><text class="name" x="640" y="210" text-anchor="middle">Salta al except</text><text class="sub-accent" x="640" y="224" text-anchor="middle">el resto del try NO se ejecuta</text><rect class="mask" x="200" y="296" width="240" height="48" rx="6"/><rect class="node" x="200" y="296" width="240" height="48" rx="6"/><text class="name" x="320" y="318" text-anchor="middle">El try termina completo</text><text class="sub" x="320" y="332" text-anchor="middle">el except se saltea</text><circle class="dot" cx="320" cy="396" r="4"/><rect class="mask" x="200" y="424" width="240" height="40" rx="20"/><rect class="node" x="200" y="424" width="240" height="40" rx="20"/><text class="name" x="320" y="448" text-anchor="middle">Sigue después del try/except</text><text class="note" x="472" y="316" text-anchor="start">Ejemplo del notebook:</text><text class="note" x="472" y="332" text-anchor="start">imprime 1 · 2 · 4 · 5</text></svg></div><footer><a href="../lessons/0010-errores-y-bucles.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos I · UNICABA 2026</
