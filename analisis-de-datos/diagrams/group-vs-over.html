<p class="eyebrow">Lección 0015 · funciones ventana</p><h1>GROUP BY colapsa, OVER no</h1><p class="subtitle">Las dos calculan la suma por cliente; la diferencia es cuántas filas salen.</p><div class="frame"><svg class="dg" viewBox="0 0 800 388" style="max-width:800px;margin-inline:auto" role="img" aria-labelledby="group-vs-over-title group-vs-over-desc" xmlns="http://www.w3.org/2000/svg"><title id="group-vs-over-title">GROUP BY vs función ventana</title><desc id="group-vs-over-desc">Cuatro facturas de entrada. GROUP BY cliente devuelve 3 filas con la suma por cliente; SUM OVER PARTITION BY cliente devuelve las 4 filas originales con el total del cliente agregado en cada una.</desc><defs><marker id="group-vs-over-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="group-vs-over-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="group-vs-over-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><path class="edge" d="M160,173 L244,173 Q252,173 252,165 L252,106 Q252,98 260,98 L344,98" marker-end="url(#group-vs-over-arrow)"/><path class="edge-accent" d="M160,205 L244,205 Q252,205 252,213 L252,271 Q252,279 260,279 L344,279" marker-end="url(#group-vs-over-arrow-accent)"/><rect class="mask" x="278" y="78" width="40" height="12" rx="2"/><text class="label" x="298" y="87" text-anchor="middle">agrupa</text><rect class="mask" x="274" y="259" width="48" height="12" rx="2"/><text class="label-accent" x="298" y="268" text-anchor="middle">ventana</text><text class="eyebrow" x="40" y="128" text-anchor="start">ENTRADA: 4 FILAS</text><rect class="mask" x="40" y="140" width="120" height="98" rx="4"/><rect class="node" x="40" y="140" width="120" height="98" rx="4"/><text ilas</text><text class="sub" x="560" y="126" text-anchor="start">colapsa</text><rect class="mask" x="344" y="196" width="416" height="168" rx="6"/><rect class="focal" x="344" y="196" width="416" height="168" rx="6"/><text class="name-mono" x="360" y="218" text-anchor="start">SUM(total) OVER (PARTITION BY cliente)</text><text class="sub-accent" x="360" y="234" text-anchor="start">cada fila conserva su detalle y suma el total del grupo</text><rect class="mask" x="360" y="248" width="216" height="98" rx="4"/><rect class="node" x="360" y="248" width="216" height="98" rx="4"/><text class="eyebrow" x="368" y="262" text-anchor="start">cliente</text><text class="eyebrow" x="432" y="262" text-anchor="start">total</text><text class="eyebrow" x="488" y="262" text-anchor="start">total_cliente</text><line class="rule" x1="360" y1="268" x2="576" y2="268"/><text class="field" x="368" y="283" text-anchor="start">Ana</text><text class="field" x="432" y="283" text-anchor="start">100</text><text class="field" x="488" y="283" text-anchor="start">150</text><text class="field" x="368" y="301" text-anchor="start">Ana</text><text class="field" x="432" y="301" text-anchor="start">50</text><text class="field" x="488" y="301" text-anchor="start">150</text><text class="field" x="368" y="319" text-anchor="start">Beto</text><text class="field" x="432" y="319" text-anchor="start">80</text><text class="field" x="488" y="319" text-anchor="start">80</text><text class="field" x="368" y="337" text-anchor="start">Caro</text><text class="field" x="432" y="337" text-anchor="start">20</text><text class="field" x="488" y="337" text-anchor="start">20</text><text class="name-lg" x="600" y="290" text-anchor="start">4 filas</text><text class="sub-accent" x="600" y="306" text-anchor="start">no colapsa</text></svg></div><footer><a href="../lessons/0015-taller-sql-chinook.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos
