<p class="eyebrow">Lección 0014 · SELECT</p><h1>Se escribe en un orden, se evalúa en otro</h1><p class="subtitle">WHERE filtra filas antes de agrupar; HAVING filtra grupos después.</p><div class="frame"><svg class="dg" viewBox="0 0 800 196" style="max-width:800px;margin-inline:auto" role="img" aria-labelledby="sql-orden-title sql-orden-desc" xmlns="http://www.w3.org/2000/svg"><title id="sql-orden-title">Orden de evaluación de SQL</title><desc id="sql-orden-desc">Las siete cláusulas en el orden en que el motor las evalúa: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY y LIMIT; WHERE y HAVING destacadas.</desc><defs><marker id="sql-orden-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-muted" points="0 0, 8 3, 0 6"/></marker><marker id="sql-orden-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker><marker id="sql-orden-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker></defs><rect class="bg" width="100%" height="100%"/><text class="eyebrow" x="20" y="28" text-anchor="start">ORDEN EN QUE EL MOTOR EVALÚA LA CONSULTA</text><path class="edge" d="M108,72 L132,72" marker-end="url(#sql-orden-arrow)"/><path class="edge" d="M220,72 L244,72" marker-end="url(#sql-orden-arrow)"/><path class="edge" d="M332,72 L356,72" marker-end="url(#sql-orden-arrow)"/><path class="edge" d="M444,72 L468,72" marker-end="url(#sql-orden-arrow)"/><path class="edge" d="M556,72 L580,72" marker-end="url(#sql-orden-arrow)"/><path class="edge" d="M668,72 L692,72" marker-end="url(#sql-orden-arrow)"/><rect class="mask" x="20" y="48" width="88" height="48" rx="6"/><rect class="node" x="20" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="28" y="62" text-anchor="start">1</text><text class="name-mono" x="64" y="80" text-anchor="middle">FROM</text><text class="sub" x="64" y="116" text-anchor="middle">tabla(s)</text><rect class="mask" x="132" y="48" width="88" height="48" rx="6"/><rect class="focal" x="132" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="140" y="62" text-anchor="start">2</text><text class="name-mono" x="176" y="80" text-anchor="middle">WHERE</text><text class="sub-accent" x="176" y="116" text-anchor="middle">filtra FILAS</text><rect class="mask" x="244" y="48" width="88" height="48" rx="6"/><rect class="node" x="244" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="252" y="62" text-anchor="start">3</text><text class="name-mono" x="288" y="80" text-anchor="middle">GROUP BY</text><text class="sub" x="288" y="116" text-anchor="middle">agrupa</text><rect class="mask" x="356" y="48" width="88" height="48" rx="6"/><rect class="focal" x="356" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="364" y="62" text-anchor="start">4</text><text class="name-mono" x="400" y="80" text-anchor="middle">HAVING</text><text class="sub-accent" x="400" y="116" text-anchor="middle">filtra GRUPOS</text><rect class="mask" x="468" y="48" width="88" height="48" rx="6"/><rect class="node" x="468" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="476" y="62" text-anchor="start">5</text><text class="name-mono" x="512" y="80" text-anchor="middle">SELECT</text><text class="sub" x="512" y="116" text-anchor="middle">elige columnas</text><rect class="mask" x="580" y="48" width="88" height="48" rx="6"/><rect class="node" x="580" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="588" y="62" text-anchor="start">6</text><text class="name-mono" x="624" y="80" text-anchor="middle">ORDER BY</text><text class="sub" x="624" y="116" text-anchor="middle">ordena</text><rect class="mask" x="692" y="48" width="88" height="48" rx="6"/><rect class="node" x="692" y="48" width="88" height="48" rx="6"/><text class="eyebrow" x="700" y="62" text-anchor="start">7</text><text class="name-mono" x="736" y="80" text-anchor="middle">LIMIT</text><text class="sub" x="736" y="116" text-anchor="middle">recorta</text><text class="note" x="400" y="152" text-anchor="middle">WHERE no ve agregados ni alias del SELECT: todavía no existen.</text><text class="sub" x="400" y="176" text-anchor="middle">se escribe: SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT</text></svg></div><footer><a href="../lessons/0014-sql-select-y-agregacion.html">Ir a la lección</a><a href="index.html">Todos los diagramas</a><a href="../suite/index.html">Suite de estudio</a><span>Análisis de Datos I · UNICABA 2026</span></footer>
